<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0e1c"/>
      <stop offset="85%" stop-color="#2a050d"/>
      <stop offset="100%" stop-color="#190206"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#f5d77f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.7"/>

  <!-- Sacred Jain Lotus / Ashtamangala Insignia -->
  <g transform="translate(32, 36)" filter="url(#goldGlow)">
    <!-- Center core petal -->
    <path d="M0 -22 C-3 -14 -4 -5 0 2 C4 -5 3 -14 0 -22 Z" fill="url(#goldGrad)"/>
    <!-- Left inner petal -->
    <path d="M0 2 C-7 -4 -12 -12 -7 -19 C-4 -12 0 -3 0 2 Z" fill="url(#goldGrad)"/>
    <!-- Right inner petal -->
    <path d="M0 2 C7 -4 12 -12 7 -19 C4 -12 0 -3 0 2 Z" fill="url(#goldGrad)"/>
    <!-- Left outer petal -->
    <path d="M0 2 C-13 -1 -18 -8 -13 -14 C-10 -7 -2 0 0 2 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Right outer petal -->
    <path d="M0 2 C13 -1 18 -8 13 -14 C10 -7 2 0 0 2 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Lotus base / calyx -->
    <path d="M-11 3 C-6 6 6 6 11 3 C8 7 -8 7 -11 3 Z" fill="url(#goldGrad)"/>
    <!-- Auspicious base bead -->
    <circle cx="0" cy="5" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Aura radiance dot -->
  <circle cx="32" cy="11" r="1.2" fill="#fff5cc"/>
</svg>
